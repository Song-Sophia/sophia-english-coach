<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sophia English Coach</title>
  <style>
    :root{--ink:#18231f;--muted:#69766f;--paper:#f8f5ee;--card:#fffdf8;--orange:#ed784b;--teal:#16796f;--line:#e6dfd2;--shadow:0 16px 45px rgba(37,51,41,.09)}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 80% 0,#d9f0e9,transparent 35%),var(--paper);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","PingFang SC",system-ui,sans-serif;min-height:100vh}
    .wrap{max-width:1120px;margin:auto;padding:32px 20px 54px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:25px}.eyebrow{color:var(--teal);font-weight:800;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(2rem,5vw,3.7rem);margin:6px 0 5px;letter-spacing:-.05em}.hero p{margin:0;color:var(--muted);max-width:630px;line-height:1.7}.streak{background:var(--ink);color:white;padding:15px 20px;border-radius:16px;white-space:nowrap}.streak strong{font-size:1.55rem;color:#f5b468;display:block}.grid{display:grid;grid-template-columns:260px 1fr;gap:20px}.panel,.card{background:rgba(255,253,248,.84);border:1px solid rgba(230,223,210,.9);border-radius:22px;box-shadow:var(--shadow)}
    .sidebar{padding:18px}.sidebar h3{font-size:.95rem;margin:4px 0 12px}.nav{display:grid;gap:7px}.nav button,.filter button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:12px;font:inherit;cursor:pointer;color:var(--ink)}.nav button.active,.nav button:hover{background:#dff1eb;color:#075f56;font-weight:700}.stat{padding:15px 0;border-bottom:1px solid var(--line);margin-bottom:12px;display:flex;justify-content:space-between}.stat b{color:var(--orange)}.goal{border-top:1px solid var(--line);margin-top:15px;padding-top:14px;color:var(--muted);font-size:.88rem}.goal select{float:right;border:1px solid var(--line);border-radius:8px;padding:4px;background:white;color:var(--ink)}
    main{min-width:0}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:15px}.search{flex:1;min-width:180px;border:1px solid var(--line);padding:12px 14px;border-radius:12px;background:white;font:inherit}.filter{display:flex;gap:6px;overflow:auto}.filter button{padding:9px 10px;font-size:.86rem;white-space:nowrap;background:#f0ece2}.filter button.active{background:var(--teal);color:white}.study{padding:clamp(20px,5vw,45px);min-height:470px;position:relative;overflow:hidden}.study:before{content:"";position:absolute;width:250px;height:250px;border-radius:50%;background:#fbe2d5;right:-85px;top:-115px}.mode-label{position:relative;color:var(--teal);font-weight:800;font-size:.83rem;letter-spacing:.1em;text-transform:uppercase}.term{position:relative;font-size:clamp(2rem,6vw,4.6rem);line-height:1.05;margin:24px 0 18px;letter-spacing:-.045em;word-break:break-word}.meaning{position:relative;font-size:1.17rem;line-height:1.65;max-width:720px}.meaning.hidden{filter:blur(8px);user-select:none}.example{position:relative;color:var(--muted);line-height:1.7;margin:26px 0 25px;padding-left:15px;border-left:3px solid #f0b39a;max-width:720px}.actions{position:relative;display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}.btn{border:0;border-radius:12px;padding:12px 15px;font:700 .95rem inherit;cursor:pointer}.primary{background:var(--ink);color:white}.good{background:#dff1eb;color:#075f56}.again{background:#fde4d8;color:#a53d21}.ghost{background:#f2eee5;color:var(--ink)}.progress{margin-top:14px;color:var(--muted);font-size:.9rem}.speak{display:none}.speak.show{display:block}.speak textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;font:inherit;min-height:90px}.feedback{margin-top:10px;color:#075f56;font-weight:650;line-height:1.5}.footer-note{color:var(--muted);font-size:.86rem;margin:16px 5px}.empty{padding:50px;text-align:center;color:var(--muted)}
    @media(max-width:760px){.wrap{padding:22px 14px}.hero{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.sidebar{display:flex;gap:18px;align-items:center;overflow:auto}.sidebar .nav{display:flex;white-space:nowrap}.sidebar h3{display:none}.sidebar .stat{border:0;margin:0;padding:0;min-width:110px}.study{min-height:430px}}
  </style>
</head>
<body><div class="wrap">
  <header class="hero"><div><div class="eyebrow">Speak it. Sell it. Remember it.</div><h1>Sophia English Coach</h1><p>为跨境电商运营打造的开口式词汇训练。每天先完成复习，再学习固定数量的新词；每个词都要放进一句真实工作英语里。</p></div><div class="streak"><strong id="dueCount">0</strong> 张待复习</div></header>
  <div class="grid"><aside class="panel sidebar"><div class="stat"><span>今日新词</span><b id="today">0 / 15</b></div><h3>训练模式</h3><nav class="nav" id="modes"><button class="active" data-mode="review">今日计划</button><button data-mode="recognize">中文说英文</button><button data-mode="speak">跟读 + 造句</button><button data-mode="browse">浏览词库</button></nav><div class="goal">每日新词目标 <select id="goal"><option value="10">10</option><option value="15" selected>15</option><option value="20">20</option><option value="30">30</option></select></div></aside>
  <main><div class="toolbar"><input id="search" class="search" placeholder="搜索词汇、中文或例句…"/><div id="filters" class="filter"></div></div><section class="card study" id="study"></section><p class="footer-note">建议每日 15 分钟：先复习旧词 → 学习新词 → 跟读示范句 3 次 → 用该词说一条自己的跨境电商工作句。系统按 1、3、7、14、30 天安排复习，数据仅保存在本浏览器。</p></main></div>
</div><script src="cards.js"></script><script>
const cards=window.CARDS||[], key='sophia-coach-v1', todayKey=new Date().toDateString();
const state=JSON.parse(localStorage.getItem(key)||'{"progress":{},"today":0,"newToday":0,"dailyGoal":15,"day":""}'); if(state.day!==todayKey){state.day=todayKey;state.today=0;state.newToday=0} state.today=state.today||0;state.newToday=state.newToday||0;state.dailyGoal=state.dailyGoal||15;
let mode='review',category='全部',query='', current=null, reveal=false;
const $=s=>document.querySelector(s), save=()=>localStorage.setItem(key,JSON.stringify(state));
const norm=s=>(s||'').toLowerCase(); const due=c=>{let p=state.progress[c.term];return !!p&&!(p.next>Date.now())}; const isNew=c=>!state.progress[c.term];
function candidates(){let a=cards.filter(c=>(category==='全部'||c.category===category)&&[c.term,c.meaning,c.example].some(x=>norm(x).includes(norm(query)))); if(mode==='review') {let d=a.filter(due); if(d.length)return d; return state.newToday<state.dailyGoal?a.filter(isNew):a.filter(c=>state.progress[c.term]).sort((a,b)=>(state.progress[a.term]?.next||0)-(state.progress[b.term]?.next||0))} return a}
function pick(){let a=candidates();if(!a.length){current=null;render();return} const unseen=a.filter(c=>!state.progress[c.term]);current=(unseen.length?unseen:a)[Math.floor(Math.random()*(unseen.length?unseen:a).length)];reveal=mode==='browse';render()}
function speak(t){if(!('speechSynthesis'in window))return alert('你的浏览器暂不支持语音朗读。');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function rate(level){if(!current)return;let wasNew=!state.progress[current.term],p=state.progress[current.term]||{level:0}; p.level=level==='again'?0:Math.min((p.level||0)+1,5);let days=level==='again'?0:[1,3,7,14,30,60][p.level];p.next=Date.now()+days*86400000;state.progress[current.term]=p;if(wasNew)state.newToday++;state.today++;save();pick()}
function modelSentence(){let e=(current.example||'').split('//')[0].trim();return e||`We need to discuss ${current.term} in today's seller meeting.`}
async function record(){let b=$('#record');if(!navigator.mediaDevices||!window.MediaRecorder){$('#feedback').textContent='当前浏览器不支持录音；请用手机录音或直接大声跟读。';return}if(window.recorder&&window.recorder.state==='recording'){window.recorder.stop();return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});window.recChunks=[];window.recorder=new MediaRecorder(stream);window.recorder.ondataavailable=e=>window.recChunks.push(e.data);window.recorder.onstop=()=>{let url=URL.createObjectURL(new Blob(window.recChunks,{type:'audio/webm'}));$('#recording').innerHTML=`<audio controls src="${url}"></audio> <span>听一遍，检查是否清楚说出了目标词。</span>`;b.textContent='🎙️ 再录一次';stream.getTracks().forEach(t=>t.stop())};window.recorder.start();b.textContent='⏹ 停止录音';$('#feedback').textContent='正在录音：跟读示范句 3 次，再说出你自己的句子。'}catch(e){$('#feedback').textContent='未获得麦克风权限。你仍可使用“听整句跟读”完成练习。'}}
function render(){const dueCount=cards.filter(due).length;$('#dueCount').textContent=dueCount;$('#today').textContent=state.newToday+' / '+state.dailyGoal; const el=$('#study');if(!current){el.innerHTML=`<div class="empty">今日 ${state.dailyGoal} 张新词已完成。可切换到“浏览词库”继续练习，或明天回来复习。</div>`;return}let prompt=mode==='recognize'?'先看中文，尝试大声说出英文':mode==='speak'?'跟读后，自己造一句工作英语':'今日卡片',sentence=modelSentence();let speakBlock=mode==='speak'?`<div class="speak show"><p class="example"><b>跟读示范句：</b>${sentence}</p><div class="actions"><button class="btn primary" id="listenSentence">🔊 听整句跟读</button><button class="btn ghost" id="record">🎙️ 录下我的跟读</button></div><div id="recording" class="feedback"></div><p class="example"><b>造句任务：</b>用 <em>${current.term}</em> 说出一句你今天会在选品、广告、物流或商家沟通中使用的话。</p><textarea id="answer" placeholder="例如：We need to improve the conversion rate before the campaign goes live."></textarea><div class="actions"><button class="btn good" id="check">我已完成跟读和造句</button></div><div id="feedback" class="feedback"></div></div>`:'';el.innerHTML=`<div class="mode-label">${prompt} · ${current.category}</div><div class="term ${mode==='recognize'&&!reveal?'meaning hidden':''}">${mode==='recognize'&&!reveal?current.meaning:current.term}</div><div class="meaning ${((mode==='recognize'&&!reveal)||(mode==='speak'&&!reveal))?'hidden':''}">${mode==='recognize'&&!reveal?'提示：先自己说，再揭晓答案。':current.meaning||'—'}</div><div class="example"><b>语境示例：</b>${sentence}</div><div class="actions"><button class="btn primary" id="listen">🔊 单词发音</button>${!reveal&&mode!=='browse'?'<button class="btn ghost" id="reveal">显示答案</button>':''}${mode!=='browse'?'<button class="btn again" data-rate="again">再来一次</button><button class="btn good" data-rate="good">认识了</button>':'<button class="btn good" id="next">下一张</button>'}</div>${speakBlock}<div class="progress">${current.source} · 已学习 ${Object.keys(state.progress).length} / ${cards.length} 张</div>`;$('#listen').onclick=()=>speak(current.term);let ls=$('#listenSentence');if(ls)ls.onclick=()=>speak(sentence);let rec=$('#record');if(rec)rec.onclick=record;let r=$('#reveal');if(r)r.onclick=()=>{reveal=true;render()};document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate(b.dataset.rate));let n=$('#next');if(n)n.onclick=pick;let c=$('#check');if(c)c.onclick=()=>{$('#feedback').textContent=$('#answer').value.trim()?'很好，句子已写下。现在点击“认识了”安排下一次复习。':'很好，已完成口语练习。现在点击“认识了”安排下一次复习。'}}
function controls(){let cats=['全部',...new Set(cards.map(c=>c.category))];$('#filters').innerHTML=cats.map(x=>`<button class="${x===category?'active':''}" data-cat="${x}">${x}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;controls();pick()});document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('active',x===b));pick()});$('#search').oninput=e=>{query=e.target.value;pick()};$('#goal').value=state.dailyGoal;$('#goal').onchange=e=>{state.dailyGoal=Number(e.target.value);save();render()}}
controls();pick();
</script></body></html>
