<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sophia English Coach</title>
  <style>
    :root{--ink:#18231f;--muted:#69766f;--paper:#f8f5ee;--card:#fffdf8;--orange:#ed784b;--teal:#16796f;--line:#e6dfd2;--shadow:0 16px 45px rgba(37,51,41,.09)}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 80% 0,#d9f0e9,transparent 35%),var(--paper);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","PingFang SC",system-ui,sans-serif;min-height:100vh}
    .wrap{max-width:1120px;margin:auto;padding:32px 20px 54px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:25px}.eyebrow{color:var(--teal);font-weight:800;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(2rem,5vw,3.7rem);margin:6px 0 5px;letter-spacing:-.05em}.hero p{margin:0;color:var(--muted);max-width:630px;line-height:1.7}.streak{background:var(--ink);color:white;padding:15px 20px;border-radius:16px;white-space:nowrap}.streak strong{font-size:1.55rem;color:#f5b468;display:block}.grid{display:grid;grid-template-columns:260px 1fr;gap:20px}.panel,.card{background:rgba(255,253,248,.84);border:1px solid rgba(230,223,210,.9);border-radius:22px;box-shadow:var(--shadow)}
    .sidebar{padding:18px}.sidebar h3{font-size:.95rem;margin:4px 0 12px}.nav{display:grid;gap:7px}.nav button,.filter button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:12px;font:inherit;cursor:pointer;color:var(--ink)}.nav button.active,.nav button:hover{background:#dff1eb;color:#075f56;font-weight:700}.stat{padding:15px 0;border-bottom:1px solid var(--line);margin-bottom:12px;display:flex;justify-content:space-between}.stat b{color:var(--orange)}
    main{min-width:0}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:15px}.search{flex:1;min-width:180px;border:1px solid var(--line);padding:12px 14px;border-radius:12px;background:white;font:inherit}.filter{display:flex;gap:6px;overflow:auto}.filter button{padding:9px 10px;font-size:.86rem;white-space:nowrap;background:#f0ece2}.filter button.active{background:var(--teal);color:white}.study{padding:clamp(20px,5vw,45px);min-height:470px;position:relative;overflow:hidden}.study:before{content:"";position:absolute;width:250px;height:250px;border-radius:50%;background:#fbe2d5;right:-85px;top:-115px}.mode-label{position:relative;color:var(--teal);font-weight:800;font-size:.83rem;letter-spacing:.1em;text-transform:uppercase}.term{position:relative;font-size:clamp(2rem,6vw,4.6rem);line-height:1.05;margin:24px 0 18px;letter-spacing:-.045em;word-break:break-word}.meaning{position:relative;font-size:1.17rem;line-height:1.65;max-width:720px}.meaning.hidden{filter:blur(8px);user-select:none}.example{position:relative;color:var(--muted);line-height:1.7;margin:26px 0 25px;padding-left:15px;border-left:3px solid #f0b39a;max-width:720px}.actions{position:relative;display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}.btn{border:0;border-radius:12px;padding:12px 15px;font:700 .95rem inherit;cursor:pointer}.primary{background:var(--ink);color:white}.good{background:#dff1eb;color:#075f56}.again{background:#fde4d8;color:#a53d21}.ghost{background:#f2eee5;color:var(--ink)}.progress{margin-top:14px;color:var(--muted);font-size:.9rem}.speak{display:none}.speak.show{display:block}.speak textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;font:inherit;min-height:90px}.feedback{margin-top:10px;color:#075f56;font-weight:650;line-height:1.5}.footer-note{color:var(--muted);font-size:.86rem;margin:16px 5px}.empty{padding:50px;text-align:center;color:var(--muted)}
    @media(max-width:760px){.wrap{padding:22px 14px}.hero{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.sidebar{display:flex;gap:18px;align-items:center;overflow:auto}.sidebar .nav{display:flex;white-space:nowrap}.sidebar h3{display:none}.sidebar .stat{border:0;margin:0;padding:0;min-width:110px}.study{min-height:430px}}
  </style>
</head>
<body><div class="wrap">
  <header class="hero"><div><div class="eyebrow">Speak it. Sell it. Remember it.</div><h1>Sophia English Coach</h1><p>为跨境电商运营打造的开口式词汇训练。按记忆强度安排复习，把词汇变成能在会议、选品和商家沟通中说出来的话。</p></div><div class="streak"><strong id="dueCount">0</strong> 张待复习</div></header>
  <div class="grid"><aside class="panel sidebar"><div class="stat"><span>今日完成</span><b id="today">0</b></div><h3>训练模式</h3><nav class="nav" id="modes"><button class="active" data-mode="review">智能复习</button><button data-mode="recognize">中文说英文</button><button data-mode="speak">情景开口</button><button data-mode="browse">浏览词库</button></nav></aside>
  <main><div class="toolbar"><input id="search" class="search" placeholder="搜索词汇、中文或例句…"/><div id="filters" class="filter"></div></div><section class="card study" id="study"></section><p class="footer-note">记忆算法：答“再来一次”会很快重现；“认识”会依次安排在 1、3、7、14、30 天后。数据仅保存在本浏览器。</p></main></div>
</div><script src="cards.js"></script><script>
const cards=window.CARDS||[], key='sophia-coach-v1', todayKey=new Date().toDateString();
const state=JSON.parse(localStorage.getItem(key)||'{"progress":{},"today":0,"day":""}'); if(state.day!==todayKey){state.day=todayKey;state.today=0}
let mode='review',category='全部',query='', current=null, reveal=false;
const $=s=>document.querySelector(s), save=()=>localStorage.setItem(key,JSON.stringify(state));
const norm=s=>(s||'').toLowerCase(); const due=c=>!(state.progress[c.term]?.next>Date.now());
function candidates(){let a=cards.filter(c=>(category==='全部'||c.category===category)&&[c.term,c.meaning,c.example].some(x=>norm(x).includes(norm(query)))); if(mode==='review') {let d=a.filter(due);return d.length?d:a.sort((a,b)=>(state.progress[a.term]?.next||0)-(state.progress[b.term]?.next||0))} return a}
function pick(){let a=candidates();if(!a.length){current=null;render();return} const unseen=a.filter(c=>!state.progress[c.term]);current=(unseen.length?unseen:a)[Math.floor(Math.random()*(unseen.length?unseen:a).length)];reveal=mode==='browse';render()}
function speak(t){if(!('speechSynthesis'in window))return alert('你的浏览器暂不支持语音朗读。');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function rate(level){if(!current)return;let p=state.progress[current.term]||{level:0}; p.level=level==='again'?0:Math.min((p.level||0)+1,5);let days=level==='again'?0:[1,3,7,14,30,60][p.level];p.next=Date.now()+days*86400000;state.progress[current.term]=p;state.today++;save();pick()}
function render(){const dueCount=cards.filter(due).length;$('#dueCount').textContent=dueCount;$('#today').textContent=state.today+' 张'; const el=$('#study');if(!current){el.innerHTML='<div class="empty">没有找到匹配的词。换个搜索词或分类试试。</div>';return}let prompt=mode==='recognize'?'先看中文，尝试大声说出英文':'今日卡片';let speakBlock=mode==='speak'?`<div class="speak show"><p class="example">任务：用这个词完成一句跨境电商工作表达。可以先录音或写下你的句子。</p><textarea id="answer" placeholder="例如：We need to improve…"></textarea><div class="actions"><button class="btn good" id="check">我已经说出来了</button></div><div id="feedback" class="feedback"></div></div>`:'';el.innerHTML=`<div class="mode-label">${prompt} · ${current.category}</div><div class="term ${mode==='recognize'&&!reveal?'meaning hidden':''}">${mode==='recognize'&&!reveal?current.meaning:current.term}</div><div class="meaning ${((mode==='recognize'&&!reveal)||(mode==='speak'&&!reveal))?'hidden':''}">${mode==='recognize'&&!reveal?'提示：先自己说，再揭晓答案。':current.meaning||'—'}</div><div class="example">${current.example||'试着把它放进一句与选品、广告、物流或商家沟通有关的话里。'}</div><div class="actions"><button class="btn primary" id="listen">🔊 听发音</button>${!reveal&&mode!=='browse'?'<button class="btn ghost" id="reveal">显示答案</button>':''}${mode!=='browse'?'<button class="btn again" data-rate="again">再来一次</button><button class="btn good" data-rate="good">认识了</button>':'<button class="btn good" id="next">下一张</button>'}</div>${speakBlock}<div class="progress">${current.source} · 已掌握 ${Object.keys(state.progress).length} / ${cards.length} 张</div>`;$('#listen').onclick=()=>speak(current.term);let r=$('#reveal');if(r)r.onclick=()=>{reveal=true;render()};document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate(b.dataset.rate));let n=$('#next');if(n)n.onclick=pick;let c=$('#check');if(c)c.onclick=()=>{$('#feedback').textContent='很好。再点击“认识了”，让系统安排下一次复习。';speak(current.term)}}
function controls(){let cats=['全部',...new Set(cards.map(c=>c.category))];$('#filters').innerHTML=cats.map(x=>`<button class="${x===category?'active':''}" data-cat="${x}">${x}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;controls();pick()});document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('active',x===b));pick()});$('#search').oninput=e=>{query=e.target.value;pick()}}
controls();pick();
</script></body></html>
